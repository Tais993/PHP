name: Update Dependabot Lockfiles

on:
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: dependabot-lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/gradle/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Dependabot update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '27'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Update lockfiles and verification metadata
        run: >-
          ./gradlew --no-daemon --write-locks --write-verification-metadata sha256
          updateAllLocks assemble testClasses

      - name: Reject changes to existing verification entries
        run: |
          if git diff --unified=0 -- gradle/verification-metadata.xml | grep '^-[^-]' > /dev/null; then
            echo 'Existing verification entries changed. Review these checksums manually.'
            exit 1
          fi

      - name: Verify generated metadata
        run: ./gradlew --no-daemon --dependency-verification strict assemble testClasses

      - name: Commit updated lockfiles and metadata
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.head_ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add -- backend/gradle/verification-metadata.xml ':(glob)backend/**/gradle.lockfile'
          if git diff --cached --quiet; then
            echo 'Lockfiles and verification metadata are already up to date.'
            exit 0
          fi

          # Supply credentials only for Git; Gradle never receives this token.
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$authorization"
          git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization")
          remote_sha=$(git "${git_auth[@]}" ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)
          if [ "$remote_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo 'PR branch changed during generation; skipping this update.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Gradle lockfiles and verification metadata'
          git "${git_auth[@]}" push origin "HEAD:refs/heads/$PR_BRANCH"
          echo 'Updated the PR. Approve follow-up workflows in GitHub if prompted.' >> "$GITHUB_STEP_SUMMARY"
