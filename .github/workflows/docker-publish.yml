name: Docker Publish

on:
  workflow_run:
    workflows:
      - SonarQube
    types:
      - completed
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  publish:
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["main", "develop"]'), github.ref_name)
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        contains(fromJSON('["main", "develop"]'), github.event.workflow_run.head_branch) &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    runs-on: ubuntu-latest

    env:
      IMAGE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tais993/php:${{ env.IMAGE_BRANCH == 'main' && 'latest' || 'develop' }}
            ghcr.io/tais993/php:${{ env.IMAGE_BRANCH }}-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    name: Deploy develop to Azure
    needs: publish
    if: (github.event.workflow_run.head_branch || github.ref_name) == 'develop'
    runs-on: ubuntu-latest
    environment: azure-dev

    permissions:
      id-token: write

    concurrency:
      group: azure-homepage-dev
      cancel-in-progress: false

    env:
      IMAGE_TAG: develop-${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy published image
        run: |
          az containerapp update \
            --name homepage-dev \
            --resource-group rg-homepage-dev \
            --image "ghcr.io/tais993/php:${IMAGE_TAG}" \
            --output none
