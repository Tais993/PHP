name: Docker Publish

on:
  workflow_run:
    workflows:
      - SonarQube
    types:
      - completed
    branches:
      - main
      - develop

  workflow_dispatch:

env:
  IMAGE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["main", "develop"]'), github.ref_name)
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        contains(fromJSON('["main", "develop"]'), github.event.workflow_run.head_branch) &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    runs-on: ubuntu-latest

    concurrency:
      group: docker-publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
      queue: max

    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: ghcr.io/tais993/php:${{ env.IMAGE_BRANCH }}-${{ env.IMAGE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update shared image tag
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_TAG: ${{ env.IMAGE_BRANCH == 'main' && 'latest' || 'develop' }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$IMAGE_BRANCH" --jq '.object.sha')
          if [ "$branch_sha" != "$IMAGE_SHA" ]; then
            echo "Skipping $BRANCH_TAG tag update because $IMAGE_SHA is no longer the tip of $IMAGE_BRANCH."
            exit 0
          fi

          docker buildx imagetools create --prefer-index=false \
            --tag "ghcr.io/tais993/php:$BRANCH_TAG" "ghcr.io/tais993/php@$IMAGE_DIGEST"
          echo 'promoted=true' >> "$GITHUB_OUTPUT"

  deploy-azure:
    name: Deploy develop to Azure
    needs: publish
    if: needs.publish.outputs.promoted == 'true' && (github.event.workflow_run.head_branch || github.ref_name) == 'develop'
    runs-on: ubuntu-latest
    environment: azure-dev

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: azure-homepage-dev
      queue: max
      cancel-in-progress: false

    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy published image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$IMAGE_BRANCH" --jq '.object.sha')
          if [ "$branch_sha" != "$IMAGE_SHA" ]; then
            echo "Skipping Azure deployment because $IMAGE_SHA is no longer the tip of $IMAGE_BRANCH."
            exit 0
          fi

          az containerapp update \
            --name homepage-dev \
            --resource-group rg-homepage-dev \
            --image "ghcr.io/tais993/php:$IMAGE_BRANCH-$IMAGE_SHA" \
            --output none
