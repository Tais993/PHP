name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    name: Cypress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Cypress against the local stack
        shell: bash
        run: |
          ../backend/gradlew -p ../backend :web:bootRun > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          npm run dev > "$RUNNER_TEMP/frontend.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error --retry 100 --retry-connrefused --retry-delay 3 --max-time 5 \
            --output /dev/null http://localhost:8080/api/boards
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --max-time 5 \
            --output /dev/null http://localhost:5173/

          npx --no-install cypress run --e2e

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cypress-failure-diagnostics
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
            frontend/cypress/screenshots
