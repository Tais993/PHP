
name: Integration Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '27'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Run integration tests
        run: ./gradlew integrationTest jacocoIntegrationTestReport

      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-coverage
          path: backend/*/build/reports/jacoco/integration/jacocoIntegrationTestReport.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-test-reports
          path: |
            backend/*/build/reports/tests/integrationTest/
            backend/*/build/test-results/integrationTest/
          if-no-files-found: warn

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: |
            ./backend/domain/build/reports/jacoco/integration/jacocoIntegrationTestReport.xml
            ./backend/application/build/reports/jacoco/integration/jacocoIntegrationTestReport.xml
            ./backend/infrastructure/build/reports/jacoco/integration/jacocoIntegrationTestReport.xml
            ./backend/web/build/reports/jacoco/integration/jacocoIntegrationTestReport.xml
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
