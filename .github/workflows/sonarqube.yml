name: SonarQube

defaults:
  run:
    working-directory: backend

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  integration-tests:
    name: Integration Tests
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - integration-tests

    # Fork PRs do not receive the SonarQube token
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: unit-coverage
          path: backend

      - name: Download integration coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: integration-coverage
          path: backend

      - name: Verify coverage reports
        run: |
          find . -path '*/build/reports/jacoco/*/*.xml' -print

          test -n "$(find . -path '*/build/reports/jacoco/unit/*.xml' -print -quit)"
          test -n "$(find . -path '*/build/reports/jacoco/integration/*.xml' -print -quit)"

      - name: Compile production classes and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./gradlew
          :web:classes
          sonar
          -Dsonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/unit/jacocoUnitTestReport.xml,**/build/reports/jacoco/integration/jacocoIntegrationTestReport.xml
