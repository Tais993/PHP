name: SonarQube

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  integration-tests:
    name: Integration Tests
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  e2e-tests:
    name: E2E Tests
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - integration-tests
      - e2e-tests

    # Fork PRs do not receive the SonarQube token
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies for analysis
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Download unit coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: unit-coverage
          path: backend/build/reports/jacoco/unit

      - name: Download integration coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: integration-coverage
          path: backend/build/reports/jacoco/integration

      - name: Download frontend E2E coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: e2e-frontend-coverage
          path: frontend/coverage

      - name: Download backend E2E coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: e2e-backend-coverage
          path: backend/build/reports/jacoco/e2e

      - name: Verify coverage reports
        run: |
          echo "Available JaCoCo reports:"
          find build/reports/jacoco -type f -print

          test -s build/reports/jacoco/unit/report.xml
          test -s build/reports/jacoco/integration/report.xml
          test -s build/reports/jacoco/e2e/report.xml
          test -s ../frontend/coverage/lcov.info

          echo "JaCoCo and LCOV reports found successfully."

      - name: Compile production classes and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./gradlew
          :domain:classes
          :application:classes
          :infrastructure:classes
          :web:classes
          sonar
          --info
          -Dsonar.verbose=true
