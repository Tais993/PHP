spring.jpa.hibernate.ddl-auto=validate

server.port=${PORT:8080}
server.servlet.context-path=/api

# Comma-separated frontend origins (scheme, host and optional port; no path).
# Production permits no cross-origin access unless explicitly configured.
app.cors.allowed-origins=${FRONTEND_ORIGINS:}
spring.docker.compose.enabled=false

#---
spring.config.activate.on-profile=local
spring.docker.compose.enabled=true
spring.docker.compose.file=../../compose.dev.yaml
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
