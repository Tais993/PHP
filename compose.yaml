services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: ghcr.io/tais993/php:develop
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/homepage
      SPRING_DATASOURCE_USERNAME: homepage
      SPRING_DATASOURCE_PASSWORD: homepage

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: homepage
      POSTGRES_USER: homepage
      POSTGRES_PASSWORD: homepage

    ports:
      - "5434:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepage -d homepage"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
